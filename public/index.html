<body>

  <main class="auth-container" id="authView">
    <section class="auth-card">
      <header class="auth-header">
        <h1>NEXO</h1>
        <p>Conecte-se com o seu mundo.</p>
      </header>

      <div class="auth-tabs">
        <button type="button" id="loginTab" class="active">Entrar</button>
        <button type="button" id="registerTab">Cadastrar</button>
      </div>

      <form id="authForm">
        <div id="nameGroup" hidden>
          <label for="name">Nome</label>
          <input id="name" name="name" type="text"
                 placeholder="Seu nome" autocomplete="name">
        </div>

        <div>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email"
                 placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div>
          <label for="password">Senha</label>
          <div class="password-wrapper">
            <input id="password" name="password" type="password"
                   placeholder="Digite sua senha"
                   autocomplete="current-password" required>
            <button type="button" id="togglePassword"
                    class="password-toggle">Mostrar</button>
          </div>
        </div>

        <div id="confirmPasswordGroup" hidden>
          <label for="confirmPassword">Confirmar senha</label>
          <div class="password-wrapper">
            <input id="confirmPassword" name="confirmPassword"
                   type="password" placeholder="Digite a senha novamente"
                   autocomplete="new-password">
            <button type="button" id="toggleConfirmPassword"
                    class="password-toggle">Mostrar</button>
          </div>
          <p id="confirmPasswordMessage" class="form-message"
             aria-live="polite"></p>
        </div>

        <p id="authMessage" class="form-message" aria-live="polite"></p>
        <button type="submit" id="authSubmit">Entrar</button>
      </form>
    </section>
  </main>

  <main id="appView" hidden>
    <aside id="sidebar">
      <h2>NEXO</h2>
      <button type="button" id="newChatButton">Nova conversa</button>
      <div id="channelsList"></div>
    </aside>

    <section id="chatView">
      <header id="chatHeader">
        <h2 id="chatTitle">NEXO</h2>
      </header>

      <div id="messages"></div>

      <form id="messageForm">
        <textarea id="messageInput" name="message"
                  placeholder="Digite sua mensagem..." rows="1"></textarea>
        <button type="submit" id="sendMessageButton">Enviar</button>
      </form>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js" defer></script>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const form = $("authForm");
      const loginTab = $("loginTab");
      const registerTab = $("registerTab");
      const nameGroup = $("nameGroup");
      const confirmGroup = $("confirmPasswordGroup");
      const password = $("password");
      const confirmPassword = $("confirmPassword");
      const message = $("authMessage");
      const submit = $("authSubmit");

      let registering = false;

      function setMode(register) {
        registering = register;
        nameGroup.hidden = !register;
        confirmGroup.hidden = !register;
        $("name").required = register;
        confirmPassword.required = register;
        password.autocomplete = register ? "new-password" : "current-password";
        submit.textContent = register ? "Criar conta" : "Entrar";
        loginTab.classList.toggle("active", !register);
        registerTab.classList.toggle("active", register);
        message.textContent = "";
        $("confirmPasswordMessage").textContent = "";
      }

      loginTab.addEventListener("click", () => setMode(false));
      registerTab.addEventListener("click", () => setMode(true));

      function toggle(input, button) {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.textContent = show ? "Ocultar" : "Mostrar";
        button.setAttribute("aria-pressed", String(show));
      }

      $("togglePassword").addEventListener("click", () =>
        toggle(password, $("togglePassword"))
      );

      $("toggleConfirmPassword").addEventListener("click", () =>
        toggle(confirmPassword, $("toggleConfirmPassword"))
      );

      confirmPassword.addEventListener("input", () => {
        $("confirmPasswordMessage").textContent =
          confirmPassword.value && confirmPassword.value !== password.value
            ? "As senhas não coincidem."
            : "";
      });

      form.addEventListener("submit", event => {
        if (registering && password.value !== confirmPassword.value) {
          event.preventDefault();
          message.textContent = "As senhas não coincidem.";
          confirmPassword.focus();
        }
      });
    })();
  </script>
</body>
</html>
