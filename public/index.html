<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>NEXO — Conecte-se</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080d18;
      --panel: #111a2b;
      --panel2: #162238;
      --border: #26344c;
      --text: #f1f5ff;
      --muted: #93a4bf;
      --accent: #6c7cff;
      --accent2: #8b5cf6;
      --danger: #fb7185;
      --success: #34d399;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left, #17234a 0, transparent 42%),
        radial-gradient(ellipse at bottom right, #211441 0, transparent 35%),
        var(--bg);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    [hidden] { display: none !important; }
    .muted { color: var(--muted); }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 25px;
      letter-spacing: 2px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 8px 30px #6c7cff35;
      color: white;
      font-size: 22px;
    }

    .auth-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-layout {
      width: 100%;
      max-width: 990px;
      display: grid;
      grid-template-columns: 1fr 420px;
      align-items: center;
      gap: 60px;
    }

    .intro h1 {
      font-size: clamp(38px, 5vw, 64px);
      line-height: 1.04;
      letter-spacing: -2px;
      margin: 28px 0 18px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #8ba0ff, #c4a4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .intro p {
      max-width: 460px;
      line-height: 1.8;
      color: var(--muted);
      font-size: 16px;
    }

    .feature-list {
      display: grid;
      gap: 15px;
      margin-top: 32px;
      color: #cbd5e1;
    }

    .feature {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .feature span:first-child {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      background: #6c7cff20;
      border: 1px solid #6c7cff45;
      border-radius: 9px;
      color: #a5b4fc;
    }

    .auth-card {
      padding: 30px;
      background: #101827ed;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 25px 90px #0005;
      backdrop-filter: blur(16px);
    }

    .auth-card h2 {
      font-size: 25px;
      margin: 0 0 8px;
    }

    .auth-card > p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 24px;
    }

    .field { margin-bottom: 17px; }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 650;
      color: #dbe4f5;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 11px;
      border: 1px solid var(--border);
      outline: none;
      background: #0a1220;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #6c7cff22;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(110deg, var(--accent), var(--accent2));
      color: white;
      font-weight: 750;
      transition: opacity .2s, transform .2s;
    }

    .primary-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      opacity: .94;
    }

    .switch-text {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin: 21px 0 0;
    }

    .link-btn {
      border: 0;
      background: transparent;
      color: #a5b4fc;
      font-weight: 700;
      padding: 4px;
    }

    .link-btn:hover { color: white; }

    .notice {
      margin: 0 0 16px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice.error {
      color: #fecdd3;
      background: #88133735;
      border: 1px solid #fb71854d;
    }

    .notice.success {
      color: #a7f3d0;
      background: #064e3b50;
      border: 1px solid #34d39950;
    }

    .app-screen {
      min-height: 100vh;
      padding: 20px;
    }

    .chat-shell {
      max-width: 1400px;
      height: calc(100vh - 40px);
      min-height: 500px;
      margin: auto;
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      background: #0c1422;
      box-shadow: 0 25px 90px #0004;
    }

    .sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #0e1727;
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      padding: 22px 18px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header .brand {
      font-size: 20px;
      letter-spacing: 1.5px;
    }

    .sidebar-header .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      font-size: 18px;
    }

    .section-label {
      padding: 22px 18px 10px;
      color: #788ba8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    .channel-list {
      padding: 0 10px;
      display: grid;
      gap: 5px;
    }

    .channel-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #a8b6cc;
      text-align: left;
      transition: .15s;
    }

    .channel-btn:hover {
      background: #19263b;
      color: white;
    }

    .channel-btn.active {
      background: #6c7cff24;
      color: white;
      box-shadow: inset 3px 0 var(--accent);
    }

    .channel-symbol {
      color: #8b9bb7;
      font-size: 19px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding: 15px;
      border-top: 1px solid var(--border);
    }

    .avatar {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #6c7cff, #8b5cf6);
      font-weight: 800;
      color: white;
    }

    .user-details {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 750;
    }

    .user-status {
      margin-top: 4px;
      font-size: 11px;
      color: var(--success);
    }

    .logout-btn {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: transparent;
      color: #9caec7;
    }

    .logout-btn:hover {
      background: #2a1b2b;
      color: #fda4af;
    }

    .chat-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      min-height: 78px;
      padding: 15px 23px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: #101a2a;
    }

    .chat-header h2 {
      font-size: 17px;
      margin: 0;
    }

    .chat-header p {
      font-size: 12px;
      color: var(--muted);
      margin: 5px 0 0;
    }

    .connection {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      background: #64748b;
      border-radius: 50%;
    }

    .connection.online .connection-dot {
      background: var(--success);
      box-shadow: 0 0 10px #34d39980;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 360px;
      padding: 30px 10px;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #6c7cff20;
      border: 1px solid #6c7cff40;
      font-size: 30px;
    }

    .welcome h3 {
      margin: 0 0 9px;
      font-size: 20px;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 100%;
    }

    .message .avatar {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      font-size: 13px;
    }

    .message-content {
      min-width: 0;
      flex: 1;
    }

    .message-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 9px;
      margin: 2px 0 6px;
    }

    .message-author {
      font-size: 13px;
      font-weight: 750;
      color: #dce5f7;
    }

    .message-time {
      font-size: 11px;
      color: #72839e;
    }

    .message-text {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
